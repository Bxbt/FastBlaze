<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastBlaze Test Form</title>
  <style>
    body { font: 14px/1.5 -apple-system, "Noto Sans Thai", sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 10px 0 4px; font-size: 12px; color: #555; }
    input, textarea { width: 100%; padding: 7px 9px; box-sizing: border-box; }
    .select { position: relative; }
    .select button { width: 100%; text-align: left; padding: 7px 9px; }
    .overflow-auto { position: absolute; left: 0; right: 0; background: #fff; border: 1px solid #ccc; z-index: 5; }
    .overflow-auto div { padding: 6px 9px; cursor: pointer; }
    .overflow-auto div:hover { background: #fde68a; }
    #mirror { background: #f1f5f9; padding: 8px; margin-top: 16px; white-space: pre; font: 12px monospace; }
  </style>
</head>
<body>
  <h2>FastBlaze test form</h2>
  <p>Load as an unpacked extension and type <code>/demo</code> in any field, or <code>/thid</code>, <code>/hi</code>, <code>/calc</code>.</p>

  <label>First name</label><input data-testid="input-first-name">
  <label>Last name</label><input data-testid="input-last-name">
  <label>ID card</label><input data-testid="input-id-card-number">
  <label>Phone — digits only (strips other chars on input)</label><input data-testid="input-digits" inputmode="numeric">
  <label>Zipcode — mask (blocks non-digit keys)</label><input data-testid="input-mask" maxlength="5">
  <label>Amount — type=number</label><input data-testid="input-number" type="number">
  <label>Sub-district</label>
  <div class="select">
    <button type="button" data-testid="select-sub-district">— choose —</button>
  </div>
  <label>Province (native select)</label>
  <select data-testid="select-province">
    <option value="">— เลือก —</option>
    <option value="10">กรุงเทพมหานคร</option>
    <option value="50">เชียงใหม่</option>
    <option value="40">ขอนแก่น</option>
  </select>
  <label>Notes (textarea)</label><textarea data-testid="input-notes" rows="3"></textarea>
  <label>Rich text (contenteditable)</label>
  <div contenteditable="true" data-testid="rich" style="border:1px solid #999;min-height:40px;padding:6px"></div>

  <div id="mirror"></div>

  <script>
    // Simulates a framework-controlled form: state only updates from input events.
    const state = {};
    const mirror = document.getElementById('mirror');
    const show = () => { mirror.textContent = JSON.stringify(state, null, 1); };
    document.querySelectorAll('input, textarea').forEach((el) => {
      el.addEventListener('input', () => { state[el.dataset.testid] = el.value; show(); });
    });
    // Field that drops anything that is not a digit (common React pattern).
    const digits = document.querySelector('[data-testid="input-digits"]');
    digits.addEventListener('input', () => {
      const clean = digits.value.replace(/\D/g, '');
      if (clean !== digits.value) digits.value = clean;
      state['input-digits'] = clean; show();
    });
    // Mask library style: block the key before it reaches the field.
    const mask = document.querySelector('[data-testid="input-mask"]');
    mask.addEventListener('keydown', (e) => {
      if (e.key.length === 1 && !/\d/.test(e.key)) e.preventDefault();
    });
    document.querySelectorAll('select').forEach((el) => {
      el.addEventListener('change', () => { state[el.dataset.testid] = el.value; show(); });
    });

    // Custom dropdown that renders options only after a click (like Headless UI).
    const btn = document.querySelector('[data-testid="select-sub-district"]');
    btn.addEventListener('click', () => {
      setTimeout(() => {
        const menu = document.createElement('div');
        menu.className = 'overflow-auto';
        ['บางรัก', 'สีลม', 'สุริยวงศ์'].forEach((name) => {
          const opt = document.createElement('div');
          opt.textContent = name;
          opt.addEventListener('click', () => { btn.textContent = name; state.subDistrict = name; menu.remove(); show(); });
          menu.append(opt);
        });
        btn.parentElement.append(menu);
      }, 150);
    });
    show();
  </script>

  <!-- Only for testing without installing the extension (?harness) -->
  <script>
    if (location.search.includes('harness')) {
      const files = ['chrome-mock.js', '../src/engine/expr.js', '../src/engine/parser.js', '../src/engine/thaiid.js',
        '../src/engine/runner.js', '../src/shared/defaults.js', '../src/shared/storage.js',
        '../src/content/dom.js', '../src/content/ui.js', '../src/content/content.js'];
      (function next(i) {
        if (i >= files.length) return;
        const s = document.createElement('script');
        s.src = files[i];
        s.onload = () => next(i + 1);
        document.body.append(s);
      })(0);
    }
  </script>
</body>
</html>
