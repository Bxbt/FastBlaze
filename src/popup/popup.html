<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>FastBlaze</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="popup.css">
  <script src="../shared/theme.js"></script>
</head>
<body>
  <header>
    <strong><img src="../../icons/icon-32.png" alt="" width="22" height="22"> <span class="brand-text">FastBlaze</span></strong>
    <span class="head-actions">
      <button id="record" title="Record clicks and typing on this page into a new snippet" data-icon="record">Record</button>
      <button id="pick" title="Pick an element on the page (Alt+Shift+P)" data-icon="crosshair">Pick</button>
      <button id="open-options" title="Manage snippets">Manage</button>
    </span>
  </header>

  <section class="thaiid">
    <span class="muted">Thai ID</span>
    <code id="tid"></code>
    <button id="tid-new" title="Generate new" aria-label="Generate new" data-icon="refresh" class="icon-only"></button>
    <button id="tid-copy" class="primary">Copy</button>
  </section>

  <input id="q" type="search" placeholder="Search snippets… (Enter = run first)" autofocus>
  <ul id="list"></ul>
  <p id="status" class="muted"></p>

  <script src="../engine/thaiid.js"></script>
  <script src="../shared/defaults.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/tabs.js"></script>
  <script src="../shared/icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
